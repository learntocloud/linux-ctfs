// apt settings used only while setup runs (passed with `apt-get -c`).
// Nothing here persists: a later plain `apt update` behaves normally.

// Skip AppStream metadata. Only graphical software centres read it, and the
// lab VM has none.
Acquire::IndexTargets::deb::DEP-11::DefaultEnabled "false";

// Ubuntu's post-update and post-install hooks (command-not-found database,
// update notifier, needrestart) are single-threaded and take minutes on a
// shared-core VM. The next regular apt run catches them up.
#clear APT::Update::Post-Invoke-Success;
#clear DPkg::Post-Invoke;
